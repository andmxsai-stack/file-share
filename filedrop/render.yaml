# Render Blueprint: Render > New > Blueprint > pick this repo.
# A persistent disk needs a paid instance; without one, files are erased on every restart/redeploy.
services:
  - type: web
    name: filedrop
    runtime: docker
    plan: starter
    disk:
      name: filedrop-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /data
      - key: MAX_FILE_MB
        value: "200"
      - key: EXPIRE_DAYS
        value: "30"
      - key: UPLOAD_PASSWORD
        sync: false
