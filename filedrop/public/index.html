<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FileDrop</title><link rel="stylesheet" href="/style.css">
</head><body><main>
<h1>FileDrop</h1>
<p class="lead">Upload a file, copy the link, open it on any device.</p>
<label class="drop" id="drop"><strong>Choose files or drop them here</strong>
<span id="hint"></span><input type="file" id="inp" multiple></label>
<div class="pw" id="pwbox" hidden><input type="password" id="pw" placeholder="Upload password" autocomplete="current-password"></div>
<div class="err" id="err" role="alert"></div>
<div id="list"></div>
</main><script src="/app.js"></script></body></html>
